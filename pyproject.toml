[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mario-rl"
version = "0.1.0"
description = "Readable academic DQN and local comparison viewer for Super Mario Bros."
requires-python = ">=3.13,<3.15"
dependencies = [
  "numpy>=2.1,<3",
  "pillow>=11,<13",
  "gymnasium>=1.1,<2",
  "torch>=2.9,<3",
  "tqdm>=4.67,<5",
]

[project.optional-dependencies]
nes = ["nes-py==9.0.1"]

[project.scripts]
mario-rl = "mario_rl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mario_rl"]

# CPU wheels avoid pulling several GB of CUDA libraries for this educational MVP.
# GPU users can install their matching PyTorch build in a separate environment.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
